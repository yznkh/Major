<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل الروابط</title>
    <!-- تحميل Bootstrap و Font Awesome للأيقونات -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="cyper.css">
</head>
<body>
    <!-- تغيير اللغة -->
    <div class="container mt-3">
        <div class="d-flex justify-content-end">
            <button id="changeLang" class="btn btn-info btn-sm">
                <i class="fas fa-language"></i> تغيير اللغة
            </button>
        </div>
    </div>
    <!-- العنوان الرئيسي -->
    <div class="container mt-5">
        <h1 class="text-center text-primary">تحليل الروابط</h1>
        <form id="urlForm" class="mt-4">
            <div class="input-group">
                <input type="text" id="urlField" class="form-control" placeholder="أدخل رابط الويب" required>
                <button type="submit" class="btn btn-success">تحليل</button>
            </div>
        </form>
        <div id="result" class="mt-4"></div>
        <!-- زر نسخ النتائج -->
        <button id="copyButton" class="btn btn-secondary mt-3" style="display:none;">
            <i class="fas fa-copy"></i> نسخ النتائج
        </button>
    </div>
    <!-- تحميل JavaScript و مكتبات Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cyper.js"></script>
</body>
</html>
